[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfgbench"
version = "0.1.0"
description = "Banco de pruebas para modelar las fases prefill y decode de Qwen3-8B en NVIDIA A100 con vLLM (TFG ITI-TFG-B26-0017)"
authors = [{ name = "José Andrés Ureta Granda" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Solo en la máquina con la A100 (Linux): fijar versiones exactas antes de la campaña.
gpu = ["vllm", "httpx>=0.27"]
analisis = ["scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
tfgbench = "tfgbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
